<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transizione classifica</title>
<style>
:root{--bg:#0b1b3a;--panel:#12284f;--line:#24407a;--txt:#eaf0ff;--mut:#8fa3cc;--acc:#e94560;--gold:#ffd700;--silver:#c9d1e0;--bronze:#cd7f32}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:var(--bg);color:var(--txt);font:15px/1.25 "Bahnschrift","Roboto Condensed","Arial Narrow",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:2px 4px 10px;border-bottom:2px solid var(--acc);margin-bottom:14px}
.top h1{margin:0;font-size:22px;font-weight:700}
.top span{font-size:13px;color:var(--mut);text-align:right}
#list{position:relative;--d:1100ms}
.row{position:absolute;left:0;right:0;top:0;height:78px;display:grid;grid-template-columns:44px 72px 1fr auto;align-items:stretch;background:var(--panel);border-radius:3px;overflow:hidden;
  transition:transform var(--d) cubic-bezier(.22,.8,.2,1),opacity var(--d) ease,box-shadow var(--d) ease}
.row.nuovo{box-shadow:0 0 0 2px var(--gold),0 0 24px rgba(255,215,0,.55)}
.pos{display:grid;place-items:center;background:var(--line);font-size:20px;font-weight:700;clip-path:polygon(0 0,100% 0,82% 100%,0 100%);padding-right:6px;transition:background .4s}
.r1 .pos{background:var(--gold);color:#1a1a2e}.r2 .pos{background:var(--silver);color:#1a1a2e}.r3 .pos{background:var(--bronze);color:#1a1a2e}
.logo{width:60px;height:60px;display:grid;place-items:center;align-self:center;margin-left:6px}
.logo img{width:100%;height:100%;object-fit:contain}
.logo.ini{width:46px;height:46px;border-radius:50%;background:var(--line);font-weight:700;font-size:15px;margin-left:12px}
.mid{padding:10px;min-width:0;display:flex;align-items:center}
.name{font-size:18px;font-weight:700;line-height:1.15}
.score{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;min-width:86px;padding:0 14px 0 24px;background:var(--acc);clip-path:polygon(18% 0,100% 0,100% 100%,0 100%);font-size:25px;font-weight:800;line-height:1;transition:background .4s}
.r1 .score{background:var(--gold);color:#1a1a2e}
.score small{font-size:11px;font-weight:600;opacity:.85;margin-top:3px}
button{display:block;margin:18px auto 0;border:0;border-radius:3px;background:var(--acc);color:#fff;font:inherit;font-weight:700;padding:10px 22px;cursor:pointer}
</style></head>
<body>
<div class="wrap">
  <div class="top"><h1 id="titolo"></h1><span id="etichetta"></span></div>
  <div id="list"></div>
  <button id="btn">Riproduci</button>
</div>
<script>
// ===== MODIFICA QUI =====
var CONFIG = {
  titolo: "TOP 5 Punteggio Partita - TSC LEAGUE",
  etichettaPrima: "Prima della giornata 12",
  etichettaDopo: "Dopo la giornata 12",
  // n = nome squadra (identico in prima e dopo), p = punti
  prima: [
    {n:"FC Pjatelo", p:91,0}, {n:"Duffman City", p:90,5}, {n:"Civapcici", p:89,0},
    {n:"Boris Siviglia", p:88,0},  {n:"FinoAlConfine", p:87,5}
  ],
  dopo: [
    {n:"FC Pjatelo", p:91,0}, {n:"Duffman City", p:90,5}, {n:"FC Cetta Nera", p:89,5},
    {n:"Civapcici", p:89,0},     {n:"Boris Siviglia", p:88,0}
  ],
  base: "https://alessioborr0.github.io/TSC-WIDGETS/img/",
  loghi: {},          // facoltativo: {"FC Pjatelo":"https://.../logo.png"}
  attesaPrima: 700,   // millisecondi di pausa sulla classifica iniziale
  durata: 1100,       // durata del movimento
  attesaDopo: 1400    // pausa finale
};
// ========================

var STEP = 84, list = document.getElementById("list"), btn = document.getElementById("btn");
var rows = {}, timers = [];

function el(t, c, x){ var e = document.createElement(t); if(c) e.className = c; if(x !== undefined) e.textContent = x; return e; }
function fmt(n){ n = Math.round(n * 10) / 10; return Number.isInteger(n) ? String(n) : n.toLocaleString("it-IT",{minimumFractionDigits:1}); }
function iniziali(n){ return n.split(/\s+/).slice(0,2).map(function(w){ return w.charAt(0); }).join("").toUpperCase(); }

function candidati(n){
  if(CONFIG.loghi[n]) return [CONFIG.loghi[n]];
  var slug = n.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"");
  return [CONFIG.base + encodeURIComponent(n) + ".png", CONFIG.base + slug + ".png"];
}
function logoEl(n){
  var d = el("div","logo"), c = candidati(n), i = 0, im = document.createElement("img");
  im.alt = "";
  function next(){
    if(i < c.length){ im.src = c[i++]; }
    else { d.className = "logo ini"; d.textContent = iniziali(n); }
  }
  im.onerror = next; d.appendChild(im); next();
  return d;
}

function creaRiga(t){
  var r = el("div","row");
  r.pos = el("div","pos"); r.appendChild(r.pos);
  r.appendChild(logoEl(t.n));
  var mid = el("div","mid"); mid.appendChild(el("div","name",t.n)); r.appendChild(mid);
  var sc = el("div","score"); r.val = el("span","",fmt(t.p)); sc.appendChild(r.val);
  sc.appendChild(el("small","","punti")); r.appendChild(sc);
  r.cur = t.p;
  return r;
}
function setRank(r, k){
  r.pos.textContent = k + 1;
  ["r1","r2","r3"].forEach(function(c){ r.classList.remove(c); });
  if(k < 3) r.classList.add("r" + (k + 1));
}
function porta(r, k, x){ r.k = k; r.style.transform = "translate(" + (x || "0") + "," + (k * STEP) + "px)"; }
function conta(r, a, b, ms){
  var t0 = null;
  function f(ts){
    if(t0 === null) t0 = ts;
    var q = Math.min((ts - t0) / ms, 1);
    r.val.textContent = fmt(a + (b - a) * q);
    if(q < 1) requestAnimationFrame(f);
  }
  requestAnimationFrame(f);
}
function after(ms, fn){ timers.push(setTimeout(fn, ms)); }

function prepara(){
  timers.forEach(clearTimeout); timers = [];
  list.textContent = ""; rows = {};
  list.style.setProperty("--d", CONFIG.durata + "ms");
  var n = Math.max(CONFIG.prima.length, CONFIG.dopo.length);
  list.style.height = (n * STEP - 6) + "px";
  document.getElementById("titolo").textContent = CONFIG.titolo;
  document.getElementById("etichetta").textContent = CONFIG.etichettaPrima;
  CONFIG.prima.forEach(function(t, k){
    var r = creaRiga(t); rows[t.n] = r;
    r.style.transition = "none"; setRank(r, k); porta(r, k);
    list.appendChild(r); void r.offsetWidth; r.style.transition = "";
  });
}

function passa(){
  var D = CONFIG.durata;
  document.getElementById("etichetta").textContent = CONFIG.etichettaDopo;
  var restano = {};
  CONFIG.dopo.forEach(function(t, k){
    restano[t.n] = true;
    var r = rows[t.n];
    if(r){
      porta(r, k);
      conta(r, r.cur, t.p, D); r.cur = t.p;
      (function(r, k){ after(D * 0.45, function(){ setRank(r, k); }); })(r, k);
    } else {
      r = creaRiga(t); rows[t.n] = r; setRank(r, k);
      r.style.transition = "none"; r.style.opacity = 0; porta(r, k, "-120%");
      list.appendChild(r); void r.offsetWidth; r.style.transition = "";
      r.style.opacity = 1; r.classList.add("nuovo"); porta(r, k);
    }
  });
  Object.keys(rows).forEach(function(nome){
    if(restano[nome]) return;
    var r = rows[nome];
    r.style.opacity = 0; porta(r, r.k, "120%");
    after(D, function(){ if(r.parentNode) r.parentNode.removeChild(r); });
  });
}

function riproduci(){
  btn.style.visibility = "hidden";
  prepara();
  after(CONFIG.attesaPrima, passa);
  after(CONFIG.attesaPrima + CONFIG.durata + CONFIG.attesaDopo, function(){ btn.style.visibility = "visible"; });
}
btn.onclick = riproduci;
after(300, riproduci);
</script>
</body></html>
